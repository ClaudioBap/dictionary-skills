name: Problema ou melhoria na skill
description: Algo nas instruções, nos verificadores ou nos hooks não funciona como devia, ou podia funcionar melhor
title: "Skill: "
labels: ["skill"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - start-project-with-trust
        - update-knowledge
    validations:
      required: true
  - type: input
    id: agente
    attributes:
      label: Agente e versão
      description: Por exemplo Claude Code 2.1.318 na extensão do VS Code, Codex, Cursor.
    validations:
      required: true
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Em que fase ou passo, e o que a skill fez.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que esperavas
    validations:
      required: true
  - type: textarea
    id: saida
    attributes:
      label: Saída dos verificadores
      description: Se aplicável, a saída de verificar.mjs ou verificar-alteracoes.mjs. Retira dados de clientes antes de colar.
      render: shell
